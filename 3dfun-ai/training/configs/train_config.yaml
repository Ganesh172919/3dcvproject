# Reference settings for the documented TinyDepth CPU experiment.
# CLI commands in training/README.md are the source of truth.
dataset:
  source: procedural
  views_per_mesh: 8
  resolution: 96
model:
  architecture: tinydepth-v1
training:
  seed: 17
  epochs: 20
  batch_size: 4
  size: 96
  learning_rate: 0.002
  silog_variance_lambda: 0.85
  multiscale_gradient_weight: 0.5
export:
  opset: 17
  precision: float32
  dynamic: [batch, height, width]
