site_name: 3DFUN AI Documentation
site_description: An End-to-End Image-to-3D Generation Framework (IIIT Dharwad 3DCV Course Project)
site_author: J Ganesh, M Jagadeshwar, B Varshith, Pranav Kashyap, C Sai Aravind (Guide Dr. Shirshendu Layek)
repo_url: https://github.com/Ganesh172919/3dcvproject
repo_name: Ganesh172919/3dcvproject

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Tutorials:
      - Quickstart Guide: tutorials/quickstart.md
      - GPU Acceleration (DirectML / CUDA): tutorials/gpu-acceleration.md
  - How-To Guides:
      - Fine-Tune Depth Estimators: how-to/fine-tune-depth.md
      - Export for 3D Printing: how-to/export-3d-printing.md
  - Reference:
      - REST API Specification: reference/api-spec.md
      - Configuration & Settings: reference/configuration.md
      - Evaluation Metrics: reference/metrics.md
  - Explanations:
      - Volumetric Inflation Theory: explanations/volumetric-inflation.md
      - INT8 Quantization Strategy: explanations/quantization-strategy.md
  - Architecture Decision Records (ADRs):
      - "0001: FastAPI & Vanilla SPA": adr/0001-fastapi-and-vanilla-spa.md
      - "0002: ONNX Runtime INT8": adr/0002-onnx-runtime-int8.md
      - "0003: SDF Over Point Clouds": adr/0003-sdf-over-pointclouds.md
      - "0004: Analytic Synthetic Benchmark": adr/0004-analytic-synthetic-benchmark.md
      - "0005: Taubin Smoothing": adr/0005-taubin-smoothing.md
  - Project Reports:
      - Technical Report: report.md
      - Acceptance Checklist: ACCEPTANCE_CHECKLIST.md
      - File Inventory: FILE_INVENTORY.md
  - Student Academic Artifacts:
      - Student Lab Notebook: STUDENT_LAB_NOTEBOOK.md
      - Viva-Voce Defense Guide: VIVA_VOCE_DEFENSE_GUIDE.md
      - Hardware Benchmark Log: STUDENT_HARDWARE_BENCHMARK_LOG.md
      - Originality form (unsigned): CERTIFICATE_OF_ORIGINALITY.md
