<!doctype html>

<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="/static/lab-icon.svg">

<header class="topbar app-topbar">

  <button type="button" class="btn sm nav-toggle" id="nav-toggle" aria-controls="nav" aria-expanded="false">Menu</button>
  <nav class="nav" id="nav" aria-label="Primary">
